name: Eleventy Build and Deploy to cPanel

on:
  push:
    branches:
      - main # or master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Set up Node.js
      uses: actions/setup-node@v5
      with:
        node-version: '22' # Or a version compatible with your project

    - name: Install 11ty and build website
      uses: extrawitz/11ty-dockerless-build@v1
   
    - name: Deploy to cPanel
      uses: SamKirkland/FTP-Deploy-Action@v4.3.4 # A popular FTP deployment action
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        server-dir: public_html/ # Target directory on cPanel (e.g., public_html/ or public_html/your-site-folder/)
        local-dir: _dist/ # Your Eleventy output directory
