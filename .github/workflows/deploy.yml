# .github/workflows/deploy.yml
name: Build and Deploy to cPanel

on:
  push:
    branches:
      - main # or whatever your main branch is called

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '20' # Use a recent Node version

    - name: Install dependencies
      run: npm ci

    - name: Build Eleventy site
      run: npm run build

    - name: Deploy to cPanel via FTP
      uses: SamKirkland/FTP-Deploy-Action@v4.3.6
      with:
        server: freakphone.net
        username: freakpho
        protocol: ftps
        port: 21 # todo replace with your web hosts ftps port
        password: ${{ secrets.FTP_PASSWORD }} # Use GitHub secrets for credentials
        local-dir: ./_dist/ # The output directory of your Eleventy build
        server-dir: ./public_html/ # The target directory on your cPanel
        # You will need to add a FTP_PASSWORD secret in GitHub settings