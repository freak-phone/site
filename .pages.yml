media:
  - name: graphics
    label: Graphics
    input: assets/graphics
    output: /assets/graphics
  - name: fonts
    label: Fonts
    input: assets/fonts
    output: /assets/fonts
  - name: media # Note: 'name' key is required here
    label: Media
    input: img
    output: /img

content:
  - name: medialog
    label: Medialog
    type: collection
    path: src/Markdown/medialog/posts
    fields:
    - { name: layout, hidden: true, type: string, default: medialog_index.njk }
    - { name: permalink, hidden: true, type: string, default: "{{ page.filePathStem }}.html" }
    - { name: tags, hidden: true, type: string, default: medialog }
    - { name: title, label: Title, type:  string }
    - { name: date, label: Date, type: date }
    - { name: description, label: Description, type: string, options: { maxlength: 180 }}
    - { name: order, label: Order, type: number }
    - { name: body, label: Body, type: rich-text }
    - name: ratings
      label: Ratings
      type: select
      options:
        multiple: true
        values:
        - value: bored
          label: Bored
        - value: brainrot
          label: I feel crazy
        - value: dislike
          label: Disliked
        - value: frustrating
          label: Frustrating
        - value: fun
          label: Fun
        - value: hate
          label: Hate
        - value: imagine
          label: Imagining
        - value: like
          label: Liked
        - value: love
          label: Loved
        - value: scared
          label: SCARY
        - value: think
          label: Thought Provoking
        - value: weep
          label: Emotional
        - value: wow
          label: Wowed Me
        - value: wtf
          label: wtf
        - value: yahoo
          label: YAAAY
  - name: changelog
    label: Changelog
    path: src/_data/changelog.json
    type: file
    list: true
    fields:
      - name: date
        label: Date
        type: string
      - name: text
        label: Update text
        type: text
        description: update information here.
      - name: link
        label: Update link
        type: string
        pattern: ^(https?:\/\/)?(www\.)?[a-zA-Z0-9.-]+\.[a-zA-Z]{2,}(\/[^\s]*)?$
      - name: image
        label: Preview image
        type: image
  - name: neighbors
    label: Neighbors
    path: src/_data/neighbors.json
    type: file
    list: true
    fields:
      - name: title
        label: site/button name
        type: string
      - name: URL
        label: url
        type: string
        pattern: ^(https?:\/\/)?(www\.)?[a-zA-Z0-9.-]+\.[a-zA-Z]{2,}(\/[^\s]*)?$
      - name: fileExtension
        label: fileExtension
        description: png gif or jpg idk
        type: string