<script>
  $(document).ready(function () {
    let typingTimer;

    // Function to handle the typing effect
    function typeEffect($element) {
      // Clear any ongoing typing animations
      clearInterval(typingTimer);

      const fullText = $element.attr('data-text');
      $element.text(''); // Reset text

      let index = 0;

      typingTimer = setInterval(function () {
        if (index < fullText.length) {
          $element.append(fullText.charAt(index));
          index++;
        } else {
          clearInterval(typingTimer);
        }
      }, 80); // Typing speed in milliseconds
    }

    // Function to switch slides
    function goToSlide(slideIndex) {
      const $slides = $('.slide');
      const $buttons = $('.nav-btn');
      const $targetSlide = $slides.eq(slideIndex);

      // 1. Fade out current slide, fade in new slide via opacity class
      $slides.removeClass('active');
      $targetSlide.addClass('active');

      // 2. Update navigation button states
      $buttons.removeClass('active');
      $buttons.eq(slideIndex).addClass('active');

      // 3. Trigger typing effect on the text inside the active slide
      const $textElement = $targetSlide.find('.type-text');
      typeEffect($textElement);
    }

    // Button click event
    $('.go').on('click', function () {
      const targetIndex = $(this).data('slide');

      // Prevent restarting if clicking the already active button
      if (!$('.slide').eq(targetIndex).hasClass('active')) {
        goToSlide(targetIndex);
      }
    });

    // Initialize the first slide's typing effect on load
    typeEffect($('.slide.active .type-text'));
  });

</script>
