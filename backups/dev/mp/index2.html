<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>

  <style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: sans-serif;
  background: #111;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}

.carousel-container {
  position: relative;
  width: 80%;
  max-width: 800px;
  height: 400px;
  overflow: hidden;
  border-radius: 8px;
  background: #222;
}

.carousel-slide {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.8s ease-in-out;
  display: flex;
  justify-content: center;
  align-items: center;
  color: #fff;
  padding: 40px;
}

/* Slide backgrounds for visual distinction */
.carousel-slide:nth-child(1) { background: #2c3e50; }
.carousel-slide:nth-child(2) { background: #8e44ad; }
.carousel-slide:nth-child(3) { background: #16a085; }

/* Active state changes opacity */
.carousel-slide.active {
  opacity: 1;
  pointer-events: auto;
}

.slide-content {
  text-align: center;
}

.typing-text {
  font-size: 2rem;
  font-weight: 600;
  border-right: 3px solid #fff;
  white-space: nowrap;
  letter-spacing: 1px;
  overflow: hidden;
  display: inline-block;
}

/* Typing cursor animation */
@keyframes blink {
  50% { border-color: transparent; }
}
.typing-text.blinking-cursor {
  animation: blink 0.7s step-end infinite;
}

/* Navigation Buttons */
.nav-btn {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  background: rgba(0, 0, 0, 0.5);
  color: white;
  border: none;
  padding: 16px;
  font-size: 18px;
  cursor: pointer;
  border-radius: 50%;
  transition: background 0.3s;
  z-index: 10;
}

.nav-btn:hover {
  background: rgba(0, 0, 0, 0.8);
}

.prev-btn { left: 20px; }
.next-btn { right: 20px; }


  </style>
</head>
<body>

<div class="carousel-container">
  <!-- Slides -->
  <div class="carousel-slide active" data-text="Welcome to the first slide experience.">
    <div class="slide-content">
      <h1 class="typing-text"></h1>
    </div>
  </div>

  <div class="carousel-slide" data-text="Discover amazing new features here.">
    <div class="slide-content">
      <h2 class="typing-text"></h2>
    </div>
  </div>

  <div class="carousel-slide" data-text="Join us and build something great.">
    <div class="slide-content">
      <h2 class="typing-text"></h2>
    </div>
  </div>

  <!-- Navigation Buttons -->
  <button class="nav-btn prev-btn" id="prevBtn">&#10094;</button>
  <button class="nav-btn next-btn" id="nextBtn">&#10095;</button>
</div>



</body>
<script>
  const slides = document.querySelectorAll('.carousel-slide');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');

  let currentIndex = 0;
  let typingTimeout;

  function typeEffect(element, text, speed = 50) {
    let index = 0;
    element.innerHTML = '';
    element.classList.add('blinking-cursor');

    function type() {
      if (index < text.length) {
        element.innerHTML += text.charAt(index);
        index++;
        typingTimeout = setTimeout(type, speed);
      } else {
        // Keep cursor blinking or remove it after typing finishes
        // element.classList.remove('blinking-cursor');
      }
    }
    type();
  }

  function updateCarousel(newIndex) {
    // Clear any ongoing typing effect timeout
    clearTimeout(typingTimeout);

    // Remove active class from current slide
    slides[currentIndex].classList.remove('active');

    // Clear the text of the current slide so it doesn't flash when returning
    const currentTypingElement = slides[currentIndex].querySelector('.typing-text');
    currentTypingElement.innerHTML = '';
    currentTypingElement.classList.remove('blinking-cursor');

    // Update index boundaries
    if (newIndex >= slides.length) {
      currentIndex = 0;
    } else if (newIndex < 0) {
      currentIndex = slides.length - 1;
    } else {
      currentIndex = newIndex;
    }

    // Add active class to new slide (triggers CSS opacity transition)
    const activeSlide = slides[currentIndex];
    activeSlide.classList.add('active');

    // Retrieve text from data attribute and trigger typing effect
    const typingElement = activeSlide.querySelector('.typing-text');
    const textToType = activeSlide.getAttribute('data-text');

    // Start typing slightly after the opacity fade begins for better visual timing
    setTimeout(() => {
      typeEffect(typingElement, textToType, 60);
    }, 300);
  }

  // Event Listeners
  nextBtn.addEventListener('click', () => updateCarousel(currentIndex + 1));
  prevBtn.addEventListener('click', () => updateCarousel(currentIndex - 1));

  // Initialize the first slide typing effect on page load
  document.addEventListener('DOMContentLoaded', () => {
    const firstSlide = slides[0];
    const typingElement = firstSlide.querySelector('.typing-text');
    const textToType = firstSlide.getAttribute('data-text');
    typeEffect(typingElement, textToType, 60);
  });


</script>
</html>
